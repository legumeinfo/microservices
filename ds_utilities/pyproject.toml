[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ds_utilities"
dynamic = ["version"]
description = "A Microservice that takes a list of gene identifiers and returns their corresponding hyperlink info"
readme = "README.md"
requires-python = ">=3.10,<4"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Connor Cameron", email = "ctc@ncgr.org" },
]
keywords = ["genomics", "bioinformatics", "microservices"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "aiohttp",
    "aiohttp-cors",
    "pysam",
    "pyyaml",
    "uvloop",
]

[project.urls]
Homepage = "https://github.com/legumeinfo/microservices"
Source = "https://github.com/legumeinfo/microservices"
"Bug Reports" = "https://github.com/legumeinfo/microservices/issues"

[project.scripts]
ds_utilities = "ds_utilities.__main__:main"

[tool.hatch.version]
path = "ds_utilities/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["ds_utilities"]
