[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "macro_synteny_paf"
dynamic = ["version"]
description = "A Microservice that returns pairwise macro-synteny blocks between all chromosomes of a query genome and a target genome, in PAF format"
readme = "README.md"
requires-python = ">=3.10,<4"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Sven Redsun", email = "sgr@ncgr.org" },
]
keywords = ["genomics", "bioinformatics", "microservices", "redis", "chado", "gff", "paf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "aiohttp",
    "aiohttp-cors",
    "grpcio",
    "protobuf",
    "redis",
    "uvloop",
]

[project.optional-dependencies]
# protoc, run before the package is built (see Dockerfile). Its generated code
# requires a protobuf runtime at least as new as itself, so upgrade the two together.
codegen = ["grpcio-tools==1.78.1"]

[project.urls]
Homepage = "https://github.com/legumeinfo/microservices"
Source = "https://github.com/legumeinfo/microservices"
"Bug Reports" = "https://github.com/legumeinfo/microservices/issues"

[project.scripts]
macro_synteny_paf = "macro_synteny_paf.__main__:main"

[tool.hatch.version]
path = "macro_synteny_paf/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["macro_synteny_paf"]
# protoc writes these into the package before it is built; they are ignored by
# git, not left out of the wheel.
artifacts = ["macro_synteny_paf/proto/**/*_pb2.py", "macro_synteny_paf/proto/**/*_pb2_grpc.py"]
