openapi: 3.0.0
info:
  title: "RESTful API for DSCensor Directed Graph"
  version: 1.0.0
servers:
  - url: /
paths:
  /genera:
    get:
      summary: Get list of all Genera
      operationId: getGenus
      responses:
        "200":
          description: "SUCCESS"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Genus"
  /species:
    get:
      summary: Get list of all species
      operationId: getSpecies
      responses:
        "200":
          description: "SUCCESS"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Species"
  /genomes:
    get:
      summary: Get list of all genome_main objects
      description: |
        Returns all of the genome_main objects from the digraph.
      parameters:
        - in: query
          name: genus
          schema:
            type: string
          description: Return only genomes matching optional genus
          required: false
        - in: query
          name: species
          schema:
            type: string
          description: Return only genomes matching optional species
          required: false
        - in: query
          name: results
          schema:
            type: integer
            minimum: 1
          description: Return only int genome results at most
          required: false
      operationId: getGenomes
      responses:
        "200":
          description: "SUCCESS"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Genome"
  /annotations:
    get:
      summary: Get list of all gene_models_main objects
      description: |
        Returns all of the gene_models_main objects from the digraph.
      parameters:
        - in: query
          name: genus
          schema:
            type: string
          description: Return only genomes matching optional genus
          required: false
        - in: query
          name: species
          schema:
            type: string
          description: Return only genomes matching optional species
          required: false
        - in: query
          name: results
          schema:
            type: integer
            minimum: 1
          description: Return only int annotation results at most
          required: false
      operationId: getGeneModelsMain
      responses:
        "200":
          description: "SUCCESS"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeneModelsMain"

  /meta:
    get:
      summary: Catalog build provenance
      description: |
        Reports whether a whole-store catalog is loaded and, if so, when and from
        which datastore-metadata commit it was built. Always answers, even with no
        catalog configured, so a client can discover why the other catalog
        endpoints are unavailable.
      operationId: getCatalogMeta
      responses:
        "200":
          description: "SUCCESS"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogProvenance"
  /catalog:
    get:
      summary: The whole catalog document
      description: |
        Returns every collection in one document, for clients that hold the
        catalog in memory themselves rather than querying endpoint by endpoint.
      operationId: getCatalog
      responses:
        "200":
          description: "SUCCESS"
          content:
            application/json:
              schema:
                type: object
        "503":
          description: "No catalog loaded"
  /collections:
    get:
      summary: Catalog collections, filtered
      operationId: getCollections
      parameters:
        - in: query
          name: genus
          schema:
            type: string
        - in: query
          name: species
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
          description: Collection type, e.g. genomes, annotations, diversity, qtl
        - in: query
          name: has_doi
          schema:
            type: boolean
          description: Only collections that publish a publication_doi
        - in: query
          name: indexed
          schema:
            type: boolean
          description: Only collections holding at least one randomly accessible file
      responses:
        "200":
          description: "SUCCESS"
          content:
            application/json:
              schema:
                type: object
        "503":
          description: "No catalog loaded"
  /types:
    get:
      summary: Collection types available, with counts
      description: |
        Answers "what kinds of data exist here", including reporting zero — which
        a directory listing cannot do.
      operationId: getTypes
      parameters:
        - in: query
          name: genus
          schema:
            type: string
        - in: query
          name: species
          schema:
            type: string
      responses:
        "200":
          description: "SUCCESS"
          content:
            application/json:
              schema:
                type: object
        "503":
          description: "No catalog loaded"
  /species-with:
    get:
      summary: Species holding every requested collection type
      description: |
        Co-availability across the whole store, e.g. which species have both
        diversity and expression data. Requires enumerating the store, so it has
        no equivalent in a crawl.
      operationId: getSpeciesWith
      parameters:
        - in: query
          name: type
          required: true
          schema:
            type: string
          description: Repeat or comma-separate, e.g. type=diversity&type=expression
      responses:
        "200":
          description: "SUCCESS"
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "No type parameter supplied"
        "503":
          description: "No catalog loaded"
  /assemblies:
    get:
      summary: Genome collections ranked by assembly quality
      description: |
        Ordered by BUSCO completeness then contig N50, best first, so a client
        selects on quality rather than on whatever a listing returned first.
      operationId: getAssemblies
      parameters:
        - in: query
          name: genus
          schema:
            type: string
        - in: query
          name: species
          schema:
            type: string
      responses:
        "200":
          description: "SUCCESS"
          content:
            application/json:
              schema:
                type: object
        "503":
          description: "No catalog loaded"
  /lineage/{identifier}:
    get:
      summary: A collection's ancestry and the publications it depends on
      operationId: getLineage
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
          description: Collection id, e.g. Wm82.gnm4.ann1.T8TQ
      responses:
        "200":
          description: "SUCCESS"
          content:
            application/json:
              schema:
                type: object
        "404":
          description: "No collection with that id"
        "503":
          description: "No catalog loaded"
  /indexed-files:
    get:
      summary: Files that can be range-read over HTTP
      description: |
        Derived from CHECKSUM, the only enumeration that lists .fai/.tbi index
        siblings — the datastore's directory index filters them out, so this
        listing cannot be reproduced by crawling. Collections whose index_status
        is "unknown" are reported as such rather than omitted.
      operationId: getIndexedFiles
      parameters:
        - in: query
          name: genus
          schema:
            type: string
        - in: query
          name: species
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
      responses:
        "200":
          description: "SUCCESS"
          content:
            application/json:
              schema:
                type: object
        "503":
          description: "No catalog loaded"

components:
  schemas:
    Genus:
      type: array
      items:
        type: string

    Species:
      type: array
      items:
        type: string

    Genome:
      type: object
      properties:
        metadata:
          $ref: "#/components/schemas/CoreObject"
        counts:
          type: object
          properties:
            contigs:
              type: integer
            records:
              type: integer
            N50:
              type: integer
            allbases:
              type: integer
            gapbases:
              type: integer
            gaps:
              type: integer
        busco:
          $ref: "#/components/schemas/Busco"

    GeneModelsMain:
      type: object
      properties:
        metadata:
          $ref: "#/components/schemas/CoreObject"
        counts:
          type: object
          properties:
            contigs:
              type: integer
            records:
              type: integer
            N50:
              type: integer
            allbases:
              type: integer
            gapbases:
              type: integer
            gaps:
              type: integer
        busco:
          $ref: "#/components/schemas/Busco"

    CoreObject:
      type: object
      properties:
        filename:
          type: string
        filetype:
          type: string
        canonical_type:
          type: string
        url:
          type: string
        genus:
          type: string
        species:
          type: string
        origin:
          type: string
        infraspecies:
          type: string
        derived_from:
          type: array
          items:
            type: string

    Busco:
      type: object
      properties:
        complete_buscos:
          type: integer
        single_copy_buscos:
          type: integer
        duplicate_buscos:
          type: integer
        fragmented_buscos:
          type: integer
        missing_buscos:
          type: integer
        total_buscos:
          type: integer

    CatalogProvenance:
      type: object
      description: |
        Build stamp for the loaded catalog. Returned by /meta and enveloped with
        every catalog query result, so staleness is visible at the point of use.
      properties:
        loaded:
          type: boolean
        schema:
          type: integer
        built_at:
          type: string
        source_commit:
          type: string
          description: datastore-metadata commit the catalog was built from
        datastore_url:
          type: string
        stats:
          type: object
