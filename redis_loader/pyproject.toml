[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "redis_loader"
dynamic = ["version"]
description = "A Redis loader for Legume Information System microservices"
readme = "README.md"
requires-python = ">=3.12,<4"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Alan Cleary", email = "acleary@gncgr.org" },
]
keywords = ["genomics", "bioinformatics", "microservices", "redis", "chado", "gff"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "psycopg2",
    "pysam",
    "redis",
]

[project.urls]
Homepage = "https://github.com/legumeinfo/microservices"
Source = "https://github.com/legumeinfo/microservices"
"Bug Reports" = "https://github.com/legumeinfo/microservices/issues"

[project.scripts]
redis_loader = "redis_loader.__main__:main"

[tool.hatch.version]
path = "redis_loader/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["redis_loader"]
